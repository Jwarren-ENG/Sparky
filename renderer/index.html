<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; connect-src 'self' https://api.openai.com; img-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; media-src 'self' file: blob:; font-src 'self' file: data:">
  <title>Sparky</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <!-- Wallpaper background -->
    <div id="wallpaper"></div>

    <!-- Main container: face + actions -->
    <div id="main">
      <!-- Face canvas -->
      <canvas id="face" width="340" height="280"></canvas>

      <!-- Status/captions area (minimal, appears only when speaking) -->
      <div id="status-area" hidden>
        <p id="status-text"></p>
      </div>

      <!-- Voice input orb / waveform -->
      <div id="voice-input">
        <div id="voice-waveform">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p id="voice-status">Say "Hey Sparky"</p>
      </div>

      <!-- Keyboard toggle (small button near voice orb) -->
      <button id="kbd-toggle" title="Type instead">⌨</button>

      <!-- Floating text input (hidden by default, appears on keyboard toggle) -->
      <div id="text-input" hidden>
        <input type="text" id="text-field" placeholder="Type your message…" />
        <button id="text-send">↩</button>
      </div>

      <!-- Dynamic action cards container -->
      <div id="cards"></div>
    </div>

    <!-- Settings drawer (slides in from edge, ultra-minimal) -->
    <div id="settings-drawer" hidden>
      <div class="drawer-inner">
        <div class="drawer-header">
          <h2>Settings</h2>
          <button id="settings-close">×</button>
        </div>
        <div class="drawer-content">
          <label class="toggle-row">
            <span>Wake word</span>
            <input type="checkbox" id="s-wake">
          </label>
          <label class="toggle-row">
            <span>Dry run</span>
            <input type="checkbox" id="s-dry">
          </label>
          <label class="toggle-row">
            <span>Proactivity</span>
            <input type="checkbox" id="s-pro">
          </label>
          <label class="toggle-row">
            <span>Quiet hours</span>
            <input type="checkbox" id="s-quiet">
          </label>
          <div id="quiet-times" hidden>
            <input type="time" id="s-qstart">
            <span>to</span>
            <input type="time" id="s-qend">
          </div>
          <label class="text-row">
            <span>Your name</span>
            <input type="text" id="s-name" placeholder="for greeting">
          </label>
        </div>
      </div>
    </div>

    <!-- Settings gear (top-right corner, minimal) -->
    <button id="settings-btn" title="Settings">⚙</button>

    <!-- Close button (top-left, minimal) -->
    <button id="close-btn" title="Close (⌘⇧S to return)">×</button>
  </div>

  <audio id="remote-audio" autoplay></audio>
  <script src="../node_modules/marked/marked.min.js"></script>
  <script src="js/face.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/wake.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
