<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; connect-src 'self' https://api.openai.com; img-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; media-src 'self' file: blob:; font-src 'self' file: data:">
  <title>Sparky</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage" data-screen-label="Sparky desktop">

    <!-- Wallpaper (Dawn / Midnight / Mist) -->
    <div id="wallpaper" class="theme-dawn"></div>

    <!-- Timer pill (top-left) -->
    <div id="timer-pill" hidden>
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none"></circle><line x1="7.5" y1="8.5" x2="7.5" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line><line x1="5.5" y1="1.2" x2="9.5" y2="1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line></svg>
      <span id="timer-text">0:00</span>
      <button id="timer-cancel" title="Cancel timer">&#215;</button>
    </div>

    <!-- Ghost app window (Sparky controlling an app) -->
    <div id="ghost-win" hidden>
      <div class="ghost-frame">
        <div class="ghost-titlebar">
          <span class="ghost-lights"><span></span><span></span><span></span></span>
          <span class="ghost-title" id="ghost-title">App</span>
        </div>
        <div class="ghost-content"><span id="ghost-action">working&hellip;</span></div>
      </div>
      <div class="ghost-badge"><span class="ghost-dot"></span><span id="ghost-badge-text">Sparky is controlling this app</span></div>
    </div>

    <!-- Drag strip for the hidden title bar -->
    <div id="dragzone"></div>

    <!-- Spoken command caption: bubble to the LEFT of the face -->
    <div id="caption" hidden></div>

    <!-- Center: the face IS the interface -->
    <div id="center">
      <div id="face-wrap">
        <div id="ring"></div>
        <div id="orb"></div>
        <div id="features">
          <div id="brow-l" class="brow"></div>
          <div id="brow-r" class="brow"></div>
          <div id="eye-l" class="eye"></div>
          <div id="eye-r" class="eye"></div>
          <svg id="mouth-svg" width="140" height="70" viewBox="0 0 140 70">
            <path id="mouth" d="M 30 22 Q 70 34 110 22 Q 70 40 30 22" fill="#26262e"></path>
          </svg>
          <div id="dot-a" class="think-dot"></div>
          <div id="dot-b" class="think-dot small"></div>
        </div>
      </div>
    </div>

    <!-- Floating cards -->
    <div id="cards"></div>

    <!-- Bottom: voice pill + typing + attach -->
    <div id="bottom-bar">
      <div id="typing-row" hidden>
        <input id="text-field" type="text" placeholder="Ask Sparky anything&hellip;" />
        <button id="text-send" title="Send">&#8593;</button>
      </div>

      <div id="voice-row">
        <button id="voice-pill" title="Talk">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="6.25" y="1.5" width="5.5" height="9.5" rx="2.75" fill="currentColor"></rect><path d="M 3.5 8.5 A 5.5 5.5 0 0 0 14.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path><line x1="9" y1="14" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line></svg>
          <span id="pill-wave">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </span>
          <span id="pill-label">Tap to talk</span>
        </button>
        <button id="mute-btn" title="Mute microphone (⌘⇧M)" hidden>
          <svg class="ic-live" width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="6.25" y="1.5" width="5.5" height="9.5" rx="2.75" fill="currentColor"></rect><path d="M 3.5 8.5 A 5.5 5.5 0 0 0 14.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path><line x1="9" y1="14" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line></svg>
          <svg class="ic-muted" width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="6.25" y="1.5" width="5.5" height="9.5" rx="2.75" fill="currentColor"></rect><path d="M 3.5 8.5 A 5.5 5.5 0 0 0 14.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path><line x1="9" y1="14" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><line x1="2.5" y1="2.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line></svg>
        </button>
        <button id="kbd-toggle" title="Type instead">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="4.5" width="17" height="11" rx="2.5" stroke="currentColor" stroke-width="1.5" fill="none"></rect><rect x="4" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="7.2" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="10.4" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="13.6" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="6" y="11.2" width="8" height="1.8" rx="0.6" fill="currentColor"></rect></svg>
        </button>
        <button id="attach-btn" title="Share a file or image">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M 15.5 8.2 L 9.3 14.4 a 4.1 4.1 0 0 1 -5.8 -5.8 L 10 2.1 a 2.75 2.75 0 0 1 3.9 3.9 L 7.6 12.3 a 1.4 1.4 0 0 1 -2 -2 L 11.2 4.7"></path></svg>
        </button>
      </div>
    </div>

    <!-- Artifact panel: "Sparky's desk" -->
    <div id="panel" hidden>
      <div class="panel-head">
        <div class="panel-title">Sparky&rsquo;s desk</div>
        <div class="panel-head-btns">
          <button id="panel-expand" title="Expand panel"><svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M 9 6 L 13.5 1.5 M 13.5 1.5 H 9.5 M 13.5 1.5 V 5.5"></path><path d="M 6 9 L 1.5 13.5 M 1.5 13.5 H 5.5 M 1.5 13.5 V 9.5"></path></svg></button>
          <button id="panel-close" title="Close">&#215;</button>
        </div>
      </div>
      <div id="panel-tabs">
        <button class="ptab active" data-tab="artifact">Artifact</button>
        <button class="ptab" data-tab="plan">Plan</button>
        <button class="ptab" data-tab="memory">Memory</button>
        <button class="ptab" data-tab="log">Log</button>
        <button class="ptab" data-tab="notes">Notes</button>
      </div>
      <div id="panel-body">
        <div class="ppage active" data-page="artifact"></div>
        <div class="ppage" data-page="plan"></div>
        <div class="ppage" data-page="memory"></div>
        <div class="ppage" data-page="log"></div>
        <div class="ppage" data-page="notes"></div>
      </div>
    </div>

    <!-- Mini-bubble controls (visible only in corner mode) -->
    <div id="mini-controls">
      <button id="mini-mute" title="Mute / unmute">
        <svg class="ic-live" width="15" height="15" viewBox="0 0 18 18" fill="none"><rect x="6.25" y="1.5" width="5.5" height="9.5" rx="2.75" fill="currentColor"></rect><path d="M 3.5 8.5 A 5.5 5.5 0 0 0 14.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path><line x1="9" y1="14" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line></svg>
        <svg class="ic-muted" width="15" height="15" viewBox="0 0 18 18" fill="none"><rect x="6.25" y="1.5" width="5.5" height="9.5" rx="2.75" fill="currentColor"></rect><path d="M 3.5 8.5 A 5.5 5.5 0 0 0 14.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path><line x1="9" y1="14" x2="9" y2="16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><line x1="2.5" y1="2.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line></svg>
      </button>
      <button id="mini-expand" title="Restore window">
        <svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M 9 6 L 13.5 1.5 M 13.5 1.5 H 9.5 M 13.5 1.5 V 5.5"></path><path d="M 6 9 L 1.5 13.5 M 1.5 13.5 H 5.5 M 1.5 13.5 V 9.5"></path></svg>
      </button>
      <button id="mini-kbd" title="Type to Sparky">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="4.5" width="17" height="11" rx="2.5" stroke="currentColor" stroke-width="1.5" fill="none"></rect><rect x="4" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="7.2" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="10.4" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="13.6" y="7" width="1.8" height="1.8" rx="0.6" fill="currentColor"></rect><rect x="6" y="11.2" width="8" height="1.8" rx="0.6" fill="currentColor"></rect></svg>
      </button>
    </div>

    <!-- Top-right controls -->
    <div id="top-controls">
      <button id="fullscreen-btn" title="Fullscreen (&#8963;&#8984;F)"><svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M 5.5 1.5 H 1.5 V 5.5"></path><path d="M 9.5 1.5 H 13.5 V 5.5"></path><path d="M 5.5 13.5 H 1.5 V 9.5"></path><path d="M 9.5 13.5 H 13.5 V 9.5"></path></svg></button>
      <button id="panel-btn" title="Artifact panel"><svg width="17" height="17" viewBox="0 0 17 17" fill="none"><rect x="1.5" y="2.5" width="14" height="12" rx="3" stroke="currentColor" stroke-width="1.5" fill="none"></rect><rect x="9.5" y="2.5" width="6" height="12" rx="3" fill="currentColor" opacity="0.45"></rect></svg></button>
      <button id="settings-btn" title="Settings">&#9881;</button>
    </div>

    <!-- Settings sheet -->
    <div id="settings-overlay" hidden>
      <div id="settings-sheet">
        <div class="settings-head">
          <div class="settings-title">Settings</div>
          <button id="settings-close">&#215;</button>
        </div>
        <div id="settings-rows"></div>
        <div id="quiet-times" hidden>
          <input type="time" id="s-qstart"> <span>to</span> <input type="time" id="s-qend">
        </div>
        <div class="settings-field">
          <span>Your name</span>
          <input type="text" id="s-name" placeholder="for greeting">
        </div>
        <button id="s-clear-clipboard" class="settings-danger">Clear clipboard history</button>
      </div>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>
  <script src="../node_modules/marked/marked.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
